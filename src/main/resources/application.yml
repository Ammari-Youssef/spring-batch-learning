spring:
  application:
    name: spring-batch-learning
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

batch:
  import:
    # 6-field cron (sec min hour dom mm dow): 02:00:00 every day
    # test faster: "0 * * * * *" (every minute) or "*/5 * * * * *" (every 5s)
    cron: "0 0 2 * * *"


# H2 embedded is auto-detected: Spring Boot configures it and auto-creates the
# Spring Batch metadata schema (spring.batch.jdbc.initialize-schema defaults to "embedded").

