spring:
  application:
    name: spring-batch-learning
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

# H2 embedded is auto-detected: Spring Boot configures it and auto-creates the
# Spring Batch metadata schema (spring.batch.jdbc.initialize-schema defaults to "embedded").

# Switch to Postgres later when you are ready:
# spring:
#   datasource:
#     url: jdbc:postgresql://localhost:5432/batch
#     username: postgres
#     password: postgres
#   batch:
#     jdbc:
#       initialize-schema: always